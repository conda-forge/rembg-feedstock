{% set name = "rembg" %}
{% set version = "2.0.83" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/rembg-{{ version }}.tar.gz
  sha256: cabcf922f0720cf52ae8187dc5d75bde35399d27b2371d3fbed6e378f523aa4e

build:
  entry_points:
    - rembg=rembg.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning >=1.0.0,<2.0.0
  run:
    - jsonschema
    - numpy
    - onnxruntime
    - opencv
    - pillow
    - pooch
    - pymatting
    - python >={{ python_min }},<4.0
    - scikit-image        # Not imported
    - scipy
    - tqdm
    # Optional for CLI extras
    - aiohttp
    - asyncer
    - click
    - fastapi
    - filetype
    - gradio
    - python-multipart
    - starlette           # Imported but not in requirements
    - uvicorn
    - watchdog

test:
  imports:
    - cv2
    - rembg
  commands:
    - pip list
    # - pip check  # Fails due to opencv
    - rembg --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/rembg
  summary: Remove image background
  license: MIT
  license_file: LICENSE.txt
  dev_url: https://github.com/danielgatis/rembg

extra:
  recipe-maintainers:
    - danielgatis
    - goanpeca
